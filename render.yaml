# Render Blueprint for the FastAPI backend. Deploy via Render's dashboard:
# New > Blueprint > connect this repo. Render prompts for every `sync: false`
# var below at that point -- nothing secret lives in this file, so it's safe
# to commit. See CLAUDE.md for what each value means; values already sitting
# in this machine's local .env can be pasted in as-is except where noted.
services:
  - type: web
    name: fig-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Production posture -- do not flip these.
      - key: FIG_WORKSPACE_API
        value: "1"
      - key: FIG_DEV_NO_AUTH
        value: "0"

      # This service's own public URL (fill in after the first deploy gives
      # you the onrender.com hostname, then redeploy) and the live frontend's.
      - key: FIG_PUBLIC_URL
        sync: false
      - key: FIG_FRONTEND_URL
        sync: false
      - key: FIG_CORS_ORIGINS
        sync: false
      - key: FIG_SITE_ORIGINS
        sync: false

      # Same Supabase Postgres project the local .env already points at.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Copy straight from local .env -- changing FIG_SESSION_SECRET signs
      # every existing session out.
      - key: FIG_SESSION_SECRET
        sync: false
      - key: FIG_SECRET_KEY
        sync: false
      - key: FIG_OWNER_EMAIL
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      # Only exists once a webhook endpoint is registered against this
      # service's real URL in the Stripe dashboard -- leave blank until then.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match a Redirect URI on the Google OAuth client:
      # https://<this-service>.onrender.com/oauth/google/callback
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false

      # Blank until a Shopify Partners app exists -- see PLATFORMS.md. Only
      # the OAuth connect step is live so far (app/oauth.py); with these
      # unset, SHOPIFY_OAUTH_ENABLED is False and Settings' Connect button
      # 503s, same degrade-quietly pattern as every other key here.
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      # Must exactly match an Allowed redirection URL on the Shopify app:
      # https://<this-service>.onrender.com/oauth/shopify/callback
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        sync: false

      # Blank until a Webflow app exists (webflow.com/dashboard -> Apps &
      # Integrations). Same degrade-quietly pattern as Shopify above.
      - key: WEBFLOW_CLIENT_ID
        sync: false
      - key: WEBFLOW_CLIENT_SECRET
        sync: false
      # Must exactly match a Redirect URI on the Webflow app:
      # https://<this-service>.onrender.com/oauth/webflow/callback
      - key: WEBFLOW_OAUTH_REDIRECT_URI
        sync: false

      # Error tracking (app/main.py) -- degrades quietly (no init call at
      # all) with no DSN. Get the DSN from Sentry -> fig-ai org ->
      # fig-ai-backend project -> Settings -> Client Keys (DSN).
      - key: SENTRY_DSN
        sync: false
      # A real value, not a secret, committed directly so this service is
      # never accidentally tagged "development" (the app/config.py default)
      # in the same issue stream as a local run.
      - key: SENTRY_ENVIRONMENT
        value: production
