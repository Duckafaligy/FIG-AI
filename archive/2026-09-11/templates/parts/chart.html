{# Score-over-time line chart. Expects `c` from reporting.chart(). #}
<div class="chart-wrap">
  <div class="chart-h">
    <h3>{{ chart_title or 'Score over time' }}</h3>
    <span class="k">{{ c.points|length }} reads &middot; {{ c.points[0].label }} &rarr; {{ c.points[-1].label }}</span>
  </div>
  <svg class="chart" viewBox="0 0 {{ c.w }} {{ c.h }}" role="img"
       aria-label="Score across {{ c.points|length }} reads, {{ c.points[0].score }} to {{ c.points[-1].score }}">
    <defs>
      <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--brand)" stop-opacity=".22"/>
        <stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/>
      </linearGradient>
    </defs>

    {% for t in c.ticks %}
      <line class="grid" x1="{{ c.pad_l }}" y1="{{ t.y }}" x2="{{ c.w - 10 }}" y2="{{ t.y }}"/>
      <text class="axis" x="{{ c.pad_l - 8 }}" y="{{ t.y + 3 }}" text-anchor="end">{{ t.value }}</text>
    {% endfor %}

    <path class="area" d="{{ c.area }}"/>
    <polyline class="line" points="{{ c.line }}"/>

    {% for p in c.points %}
      <circle class="dot-hit" cx="{{ p.x }}" cy="{{ p.y }}" r="14"
              data-score="{{ p.score }}" data-when="{{ p.when }}" data-pages="{{ p.pages }}"></circle>
      <circle class="dot {{ 'last' if loop.last }}" cx="{{ p.x }}" cy="{{ p.y }}" r="3.5"></circle>
    {% endfor %}

    {% for p in c.points %}
      {% if loop.first or loop.last or (c.points|length <= 6) %}
      <text class="axis" x="{{ p.x }}" y="{{ c.h - 8 }}" text-anchor="middle">{{ p.label }}</text>
      {% endif %}
    {% endfor %}
  </svg>
  <div class="chart-tip" id="chartTip"></div>
</div>
